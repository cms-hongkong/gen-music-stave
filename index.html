<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>彩色音符樂譜製作雛形</title>
<style>
  /* 頁面基本排版及顏色 */
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex; 
    background-color: #fcf7ec; /* 仿照圖片帶有微暖嘅底色 */
    margin: 0; 
    padding: 20px; 
  }
  
  /* 左邊工具列 */
  #sidebar { 
    width: 250px; 
    background-color: white; 
    padding: 20px; 
    border-radius: 15px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
    margin-right: 20px; 
  }
  
  /* 右邊樂譜畫布 */
  #canvas-area { 
    flex-grow: 1; 
    background-color: white; 
    border-radius: 15px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
    padding: 40px; 
    position: relative; 
    min-height: 600px; 
    overflow: hidden; 
  }
  
  h2 { font-size: 18px; color: #555; text-align: center; }
  
  /* 音符選擇區排版 */
  .note-palette { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 12px; 
    justify-content: center; 
  }
  
  /* 音符圓圈樣式 */
  .note { 
    width: 45px; 
    height: 45px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: white; 
    font-weight: bold; 
    cursor: grab; 
    user-select: none; 
    font-size: 14px; 
    box-shadow: 1px 2px 4px rgba(0,0,0,0.2); 
  }
  .note:active { cursor: grabbing; }
  
  /* 七彩音符顏色 (對應 Do Re Mi) */
  .do { background-color: #ff5252; }
  .re { background-color: #ff9f43; }
  .mi { background-color: #feca57; color: #555; }
  .fa { background-color: #1dd1a1; }
  .sol { background-color: #54a0ff; }
  .la { background-color: #5f27cd; }
  .ti { background-color: #ff9ff3; color: #555; }

  /* 簡單嘅五線譜裝飾（背景用） */
  .line { width: 100%; height: 2px; background-color: #e0e0e0; margin-bottom: 25px; }
  .staff { margin-top: 80px; }
</style>
</head>
<body>

<!-- 左邊：工具列 -->
<div id="sidebar">
  <h2>拖曳音符到右邊</h2>
  <div class="note-palette">
    <!-- 設定 draggable="true" 允許拖曳 -->
    <div class="note do" draggable="true" ondragstart="drag(event)">Do</div>
    <div class="note re" draggable="true" ondragstart="drag(event)">Re</div>
    <div class="note mi" draggable="true" ondragstart="drag(event)">Mi</div>
    <div class="note fa" draggable="true" ondragstart="drag(event)">Fa</div>
    <div class="note sol" draggable="true" ondragstart="drag(event)">Sol</div>
    <div class="note la" draggable="true" ondragstart="drag(event)">La</div>
    <div class="note ti" draggable="true" ondragstart="drag(event)">Ti</div>
  </div>
  <hr style="margin: 30px 0; border: 0; border-top: 1px dashed #ccc;">
  <p style="font-size: 13px; color: #888; text-align: center;">操作說明：用滑鼠㩒實左邊嘅彩色圓圈，拉去右邊嘅白紙上面放手。</p>
</div>

<!-- 右邊：畫布區 -->
<div id="canvas-area" ondragover="allowDrop(event)" ondrop="drop(event)">
  <!-- 畫面上嘅五線譜 -->
  <div class="staff">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
  </div>
</div>

<script>
  // 記錄被拖曳嘅音符 HTML 同滑鼠點擊位置
  let draggedElementHtml = "";
  let offsetX = 0;
  let offsetY = 0;

  // 開始拖曳時執行
  function drag(ev) {
    draggedElementHtml = ev.target.outerHTML;
    const rect = ev.target.getBoundingClientRect();
    offsetX = ev.clientX - rect.left;
    offsetY = ev.clientY - rect.top;
  }

  // 允許將物件放低（Drop）
  function allowDrop(ev) {
    ev.preventDefault(); 
  }

  // 放低物件時執行
  function drop(ev) {
    ev.preventDefault();
    
    // 建立一個新嘅音符元素
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = draggedElementHtml;
    const newNote = tempDiv.firstChild;
    
    // 移除新音符嘅拖曳屬性，等佢固定喺畫布上
    newNote.removeAttribute('draggable');
    newNote.style.cursor = 'default';
    
    // 設定絕對位置 (Absolute Positioning)
    newNote.style.position = 'absolute';
    
    // 計算並設定擺放嘅 X 同 Y 座標
    const canvasRect = document.getElementById('canvas-area').getBoundingClientRect();
    newNote.style.left = (ev.clientX - canvasRect.left - offsetX) + 'px';
    newNote.style.top = (ev.clientY - canvasRect.top - offsetY) + 'px';
    
    // 將新音符加入右邊嘅畫布中
    document.getElementById('canvas-area').appendChild(newNote);
  }
</script>

</body>
</html>
