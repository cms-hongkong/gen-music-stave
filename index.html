<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡雅音樂教室 Clare Music Studio - 互動彩虹樂譜</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; background-color: #f4f6f9; padding: 20px; margin: 0;
        }
        .header { margin-bottom: 20px; }
        .company-name { color: #8e44ad; font-size: 14px; font-weight: bold; margin-bottom: -10px; letter-spacing: 2px;}
        
        /* 頂部按鈕區 */
        .top-bar {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
        }
        .btn-primary { 
            padding: 10px 20px; font-size: 16px; border-radius: 20px; border: none; 
            cursor: pointer; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-teacher { background: #333; }
        .btn-student { background: #e74c3c; }
        .btn-export { background: #27ae60; }
        .btn-play { background: #8e44ad; }
        .btn-action { background: #95a5a6; color: white; padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px;}

        /* 控制面板 */
        .control-panel {
            background: white; padding: 15px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 0 auto 20px auto;
            max-width: 1000px; display: flex; flex-direction: column; gap: 15px; align-items: center;
        }
        .control-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 5px; background: #f8f9fa; padding: 5px 10px; border-radius: 10px; }
        .control-group label { font-weight: bold; color: #2c3e50; font-size: 13px; }
        select, input[type="text"] { 
            padding: 5px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; 
        }
        input[type="text"] { width: 100px; text-align: center; }

        /* 樂譜標題 */
        .sheet-title {
            font-size: 32px; font-weight: bold; color: #2c3e50; margin: 0 auto 25px auto;
            text-align: center; min-height: 40px; width: 100%;
        }

        /* 樂譜區 */
        .score-area { 
            min-height: 250px; background: white; border: 3px dashed #cbd5e1; 
            border-radius: 20px; margin: 0 auto 20px auto; width: 95%; max-width: 1000px;
            padding: 30px 25px; display: flex; flex-wrap: wrap; 
            align-items: center; justify-content: flex-start; align-content: flex-start;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); gap: 0; 
        }

        /* 項目容器 */
        .item-container {
            display: flex; flex-direction: column; align-items: center; 
            margin-right: 18px; margin-bottom: 25px; justify-content: center;
            cursor: pointer;
        }
        .item-container.half-beat { margin-right: 4px; }

        /* 選中特效 */
        .selected-item .score-note, .selected-item .bar-line, .selected-item.line-break.edit-mode {
            box-shadow: 0 0 0 4px #3498db, 0 8px 15px rgba(0,0,0,0.3) !important;
            transform: scale(1.1); z-index: 5;
        }
        .selected-item .bar-line { background-color: #3498db; }

        /* 拍子記號 */
        .time-sig {
            font-size: 38px; font-weight: bold; color: #2c3e50; 
            display: flex; flex-direction: column; line-height: 0.9;
            justify-content: center; align-items: center;
            height: 75px; margin-right: 5px;
        }

        .top-text, .bottom-text {
            font-size: 16px; font-weight: bold; color: #555; 
            height: 24px; display: flex; align-items: center; justify-content: center; width: 100%;
        }

        /* 音符主體 */
        .score-note { 
            display: flex; align-items: center; justify-content: center; 
            color: #333; animation: popIn 0.3s ease; 
            box-shadow: 0 5px 8px rgba(0,0,0,0.2); transition: transform 0.1s, box-shadow 0.2s; 
            position: relative; margin: 5px 0;
        }
        
        .note-content { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
        .note-solfege { font-size: 20px; font-weight: bold; }
        .note-pitch { font-size: 13px; opacity: 0.9; font-weight: bold;}

        .playing-highlight { transform: scale(1.15); box-shadow: 0 0 15px 5px rgba(241, 196, 15, 0.8) !important; z-index: 10; }

        .beat-05 { width: 55px; height: 55px; border-radius: 50%; }
        .beat-1 { width: 75px; height: 75px; border-radius: 50%; }
        .beat-2 { width: 145px; height: 75px; border-radius: 40px; }
        .beat-4 { width: 280px; height: 75px; border-radius: 40px; }
        
        .rest-note { background-color: #bdc3c7; color: white; font-size: 24px; font-weight: bold; border-radius: 20px; }
        .bar-line { width: 3px; height: 75px; background-color: #34495e; margin: 0 15px; border-radius: 2px; transition: 0.2s;}

        .dot { position: absolute; font-size: 30px; line-height: 1; color: black; font-weight: bold;}
        .dot-high { top: -18px; }
        .dot-low { bottom: -18px; }

        /* 換行提示樣式 */
        .line-break { flex-basis: 100%; height: 0; margin: 0; cursor: pointer; transition: 0.2s;}
        .line-break.edit-mode {
            height: 20px; border-bottom: 2px dashed #cbd5e1;
            margin-bottom: 20px; margin-top: 10px; position: relative;
        }
        .line-break.edit-mode::after {
            content: "↩️ 換行位置 Line Break"; position: absolute; right: 10px; top: -8px;
            font-size: 12px; color: #94a3b8; font-weight: bold; background: white; padding: 0 5px;
        }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

        .keyboard { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .note-btn { 
            width: 65px; height: 65px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.5); 
            font-size: 15px; font-weight: bold; color: #333; cursor: pointer; 
            box-shadow: 0 6px 8px rgba(0,0,0,0.15); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; line-height: 1.1;
        }
        .note-btn:active { transform: scale(0.9); }
        
        .c-red { background-color: #FF4D4D; color: white; }
        .d-orange { background-color: #FF9E2C; color: white; }
        .e-yellow { background-color: #FFD700; color: black;}
        .f-green { background-color: #2ECC71; color: white; }
        .g-blue { background-color: #3498DB; color: white; }
        .a-indigo { background-color: #2980B9; color: white; }
        .b-purple { background-color: #9B59B6; color: white; }
        .acc-black { background-color: #2c3e50; color: white; }
        .rest-gray { background-color: #bdc3c7; color: white; font-size: 14px; }
        .hidden { display: none !important; }

        .print-only-footer { display: none; }

        /* =========================================
           iOS 完美 10 音版列印優化 (PDF Export)
           ========================================= */
        @media print {
            @page { margin: 5mm !important; }
            body { 
                background: white; padding: 0 !important; margin: 0 !important; 
                -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
            }
            .header, .top-bar, #teacherControls, #studentControls { display: none !important; }
            .score-area { 
                border: none !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important;
                margin: 0 !important; padding: 0 !important; background: transparent !important; display: block !important; 
            }
            .item-container { 
                display: inline-flex !important; vertical-align: top;
                page-break-inside: avoid !important; break-inside: avoid !important; -webkit-column-break-inside: avoid !important;
                margin-right: 10px !important; margin-bottom: 15px !important; 
            }
            .item-container.half-beat { margin-right: 2px !important; }
            
            .beat-1 { width: 55px !important; height: 55px !important; } 
            .beat-05 { width: 42px !important; height: 42px !important; }
            .beat-2 { width: 110px !important; height: 55px !important; }
            .beat-4 { width: 220px !important; height: 55px !important; }
            .rest-note { font-size: 18px !important; }
            
            .note-solfege { font-size: 16px !important; }
            .note-pitch { font-size: 10px !important; }
            
            .time-sig { font-size: 32px !important; height: 55px !important; margin-right: 2px !important;}
            .bar-line { height: 55px !important; margin: 0 8px !important; }
            
            .dot { font-size: 24px !important; }
            .dot-high { top: -14px !important; }
            .dot-low { bottom: -14px !important; }
            .top-text, .bottom-text { font-size: 12px !important; height: 18px !important; }
            
            .line-break { display: block !important; width: 100% !important; height: 0 !important; margin: 0 !important; padding: 0 !important; border: none !important; }
            .line-break.edit-mode::after { display: none !important; }
            
            .print-only-footer { 
                display: block; text-align: center; margin-top: 30px; 
                font-size: 12px; color: #7f8c8d; font-weight: bold; border-top: 1px solid #eee; padding-top: 10px;
                page-break-inside: avoid !important;
            }
            .selected-item .score-note, .selected-item .bar-line { box-shadow: none !important; transform: scale(1) !important; background-color: inherit; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="company-name">卡雅音樂教室 Clare Music Studio</div>
        <h2 style="color: #2c3e50; margin-top: 15px;">🎵 互動彩虹樂譜 Interactive Rainbow Score</h2>
    </div>

    <div class="top-bar">
        <button id="modeBtn" class="btn-primary btn-teacher" onclick="toggleMode()">🧑‍🏫 老師端 Teacher</button>
        <button class="btn-primary btn-play" onclick="playAll()">▶️ 播放全曲 Play All</button>
        <button class="btn-primary btn-export" onclick="exportPDF()">📄 匯出 Export PDF</button>
        
        <div class="control-group" style="background: white; border: 1px solid #ddd;">
            <label>顯示 Display：</label>
            <select id="displaySelect" onchange="renderScore()">
                <option value="both" selected>唱名+音名 Solfege+Pitch</option>
                <option value="solfege">只顯示唱名 Solfege</option>
                <option value="pitch">只顯示音名 Pitch</option>
            </select>
        </div>
        <div class="control-group" style="background: white; border: 1px solid #ddd;">
            <label>拍子 Time：</label>
            <select id="timeSigSelect" onchange="renderScore()">
                <option value="4/4" selected>4/4</option>
                <option value="3/4">3/4</option>
                <option value="2/4">2/4</option>
            </select>
        </div>
    </div>

    <div id="teacherControls">
        <div class="control-panel">
            <div class="control-row">
                <div class="control-group" style="background: #e8f4f8;">
                    <label>標題 Title：</label>
                    <input type="text" id="titleInput" placeholder="例: 歡樂頌" style="width: 140px;" oninput="updateTitle()">
                </div>
                <div class="control-group">
                    <label>速度 Tempo：</label>
                    <select id="bpmSelect">
                        <option value="60">慢 Slow</option>
                        <option value="90" selected>中 Mid</option>
                        <option value="120">快 Fast</option>
                    </select>
                </div>
            </div>
            <div class="control-row">
                <div class="control-group">
                    <label>升降 Accidental：</label>
                    <select id="accidentalSelect">
                        <option value="0" selected>♮ 原音 Nat</option>
                        <option value="1">♯ 升號 Sharp</option>
                        <option value="-1">♭ 降號 Flat</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>高低 Octave：</label>
                    <select id="octaveSelect">
                        <option value="-1">低音 Low</option>
                        <option value="0" selected>中音 Mid</option>
                        <option value="1">高音 High</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>長度 Beat：</label>
                    <select id="beatSelect">
                        <option value="0.5">半拍 0.5</option>
                        <option value="1" selected>一拍 1</option>
                        <option value="2">兩拍 2</option>
                        <option value="4">四拍 4</option>
                    </select>
                </div>
            </div>
            
            <div class="control-row">
                <div class="control-group" style="background: #e8f4f8;">
                    <label>指法(頂) Fingering：</label>
                    <input type="text" id="fingeringInput" placeholder="例: 1" style="width: 80px;">
                    <label style="margin-left:5px;">文字(底) Lyric：</label>
                    <input type="text" id="lyricInput" placeholder="例: 爸" style="width: 80px;">
                </div>
                <div class="control-group" style="background: transparent;">
                    <button class="btn-action" style="background:#34495e;" onclick="addScoreItem({type: 'barline'})">➕ 小節線 Barline</button>
                    <button class="btn-action" style="background:#2980b9;" onclick="addScoreItem({type: 'linebreak'})">↩️ 換行 Break</button>
                    <button id="undoBtn" class="btn-action" onclick="undoOrDelete()" style="background:#e67e22;">↩️ 復原 Undo</button>
                    <button class="btn-action" onclick="clearScore()" style="background:#e74c3c;">🗑️ 清空 Clear</button>
                </div>
            </div>
            
            <!-- 全新加入的檔案存取區塊 -->
            <div class="control-row" style="margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 15px; width: 100%;">
                <div class="control-group" style="background: transparent;">
                    <button class="btn-action" onclick="saveScore()" style="background:#16a085; font-size: 15px; padding: 8px 16px;">💾 儲存樂譜 Save File</button>
                    <button class="btn-action" onclick="document.getElementById('fileInput').click()" style="background:#8e44ad; font-size: 15px; padding: 8px 16px;">📂 開啟樂譜 Load File</button>
                    <!-- 隱藏的檔案輸入框 -->
                    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadScore(event)">
                </div>
            </div>

            <p style="margin: 0; font-size: 13px; color: #7f8c8d;">💡 提示：點擊樂譜上的音符可將其「選取」，然後直接按下上方琴鍵即可替換該音符。<br>Hint: Click a note to select it, then press a key above to replace it.</p>
        </div>
        
        <div class="keyboard" id="keyboardArea">
            <button class="note-btn c-red" onclick="processInput(261.63, 'Do', 'C', 'c-red', false)"><span>Do</span><span style="font-size:10px;">C</span></button>
            <button class="note-btn d-orange" onclick="processInput(293.66, 'Re', 'D', 'd-orange', false)"><span>Re</span><span style="font-size:10px;">D</span></button>
            <button class="note-btn e-yellow" onclick="processInput(329.63, 'Mi', 'E', 'e-yellow', false)"><span>Mi</span><span style="font-size:10px;">E</span></button>
            <button class="note-btn f-green" onclick="processInput(349.23, 'Fa', 'F', 'f-green', false)"><span>Fa</span><span style="font-size:10px;">F</span></button>
            <button class="note-btn g-blue" onclick="processInput(392.00, 'Sol', 'G', 'g-blue', false)"><span>Sol</span><span style="font-size:10px;">G</span></button>
            <button class="note-btn a-indigo" onclick="processInput(440.00, 'La', 'A', 'a-indigo', false)"><span>La</span><span style="font-size:10px;">A</span></button>
            <button class="note-btn b-purple" onclick="processInput(493.88, 'Ti', 'B', 'b-purple', false)"><span>Ti</span><span style="font-size:10px;">B</span></button>
            <button class="note-btn rest-gray" onclick="processInput(0, '休', '', 'rest-gray', true)" style="border-radius: 15px;"><span>休</span><span style="font-size:10px;">Rest</span></button>
        </div>
    </div>

    <div id="studentControls" class="hidden" style="margin-bottom: 20px;">
        <p style="font-size: 20px; color: #e74c3c; font-weight: bold;">👀 請看著畫面上的音符點擊發聲吧！<br>Please look at the notes and tap to play!</p>
    </div>

    <div id="displayTitle" class="sheet-title hidden"></div>
    <div class="score-area" id="scoreArea" onclick="handleScoreClick(event)"></div>
    
    <div class="print-only-footer">© 卡雅音樂教室 Clare Music Studio</div>

    <script>
        let isTeacherMode = true;
        let scoreData = []; 
        let isPlayingAll = false;
        let selectedIndex = null; 
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        document.body.addEventListener('click', function() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true }); 

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function updateTitle() {
            const titleText = document.getElementById('titleInput').value;
            const displayTitle = document.getElementById('displayTitle');
            if (titleText.trim() !== '') {
                displayTitle.innerText = titleText;
                displayTitle.classList.remove('hidden');
            } else {
                displayTitle.classList.add('hidden');
            }
        }

        // ============================
        // 全新存取功能 (Save & Load)
        // ============================
        function saveScore() {
            if (scoreData.length === 0) {
                alert("樂譜目前是空的，沒有內容可以儲存！\nThe score is empty, nothing to save!");
                return;
            }
            
            const titleText = document.getElementById('titleInput').value || '未命名樂譜_Untitled';
            
            // 將所有設定和樂譜資料打包
            const saveData = {
                title: document.getElementById('titleInput').value,
                timeSig: document.getElementById('timeSigSelect').value,
                display: document.getElementById('displaySelect').value,
                bpm: document.getElementById('bpmSelect').value,
                score: scoreData
            };

            // 產生 JSON 檔案並觸發下載
            const blob = new Blob([JSON.stringify(saveData)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = titleText + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadScore(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    
                    // 還原各種設定
                    if (loadedData.title !== undefined) {
                        document.getElementById('titleInput').value = loadedData.title;
                        updateTitle();
                    }
                    if (loadedData.timeSig) document.getElementById('timeSigSelect').value = loadedData.timeSig;
                    if (loadedData.display) document.getElementById('displaySelect').value = loadedData.display;
                    if (loadedData.bpm) document.getElementById('bpmSelect').value = loadedData.bpm;
                    
                    // 還原音符資料
                    if (Array.isArray(loadedData.score)) {
                        scoreData = loadedData.score;
                    }
                    
                    selectedIndex = null;
                    renderScore();
                    
                    // 清空 file input，確保下次可以載入同一個檔案
                    document.getElementById('fileInput').value = '';
                    
                } catch (err) {
                    alert("檔案讀取失敗，格式可能不正確。\nFailed to load file, invalid format.");
                }
            };
            reader.readAsText(file);
        }
        // ============================

        function playTone(baseFreq, octaveIndex, beats, isRest) {
            if (isRest || baseFreq === 0) return; 
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const finalFreq = baseFreq * Math.pow(2, octaveIndex);
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.value = finalFreq;
            osc2.frequency.value = finalFreq;
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.start();
            osc2.start();
            
            const bpm = parseInt(document.getElementById('bpmSelect').value);
            const beatDuration = 60 / bpm; 
            const duration = beats * beatDuration;
            
            gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc1.stop(audioCtx.currentTime + duration);
            osc2.stop(audioCtx.currentTime + duration);
        }

        function processInput(baseFreq, solfege, pitch, colorClass, isRest) {
            const octaveIndex = parseInt(document.getElementById('octaveSelect').value);
            const beats = parseFloat(document.getElementById('beatSelect').value);
            const accidental = parseInt(document.getElementById('accidentalSelect').value);
            const fingering = document.getElementById('fingeringInput').value;
            const lyric = document.getElementById('lyricInput').value;
            
            let finalFreq = baseFreq;
            let finalSolfege = solfege;
            let finalPitch = pitch;
            
            if (!isRest) {
                if (accidental === 1) { 
                    finalFreq = baseFreq * Math.pow(2, 1/12);
                    finalSolfege += '♯';
                    finalPitch += '♯';
                    colorClass = 'acc-black'; 
                } else if (accidental === -1) { 
                    finalFreq = baseFreq * Math.pow(2, -1/12);
                    finalSolfege += '♭';
                    finalPitch += '♭';
                    colorClass = 'acc-black';
                }
            }
            
            playTone(finalFreq, octaveIndex, beats, isRest);
            
            if (isTeacherMode) {
                const newItem = {
                    type: isRest ? 'rest' : 'note',
                    baseFreq: finalFreq,
                    octave: octaveIndex,
                    beats: beats,
                    solfege: finalSolfege, 
                    pitch: finalPitch,     
                    color: colorClass,
                    fingering: fingering,
                    lyric: lyric,
                    isRest: isRest,
                    id: Date.now() 
                };

                if (selectedIndex !== null) {
                    newItem.id = scoreData[selectedIndex].id || Date.now();
                    scoreData[selectedIndex] = newItem;
                    selectedIndex = null; 
                } else {
                    scoreData.push(newItem);
                }

                document.getElementById('fingeringInput').value = '';
                document.getElementById('lyricInput').value = '';
                document.getElementById('accidentalSelect').value = "0";
                renderScore();
            }
        }

        function addScoreItem(item) {
            if (selectedIndex !== null) {
                scoreData[selectedIndex] = item;
                selectedIndex = null;
            } else {
                scoreData.push(item);
            }
            renderScore();
        }

        function undoOrDelete() {
            if (selectedIndex !== null) {
                scoreData.splice(selectedIndex, 1);
                selectedIndex = null;
            } else if (scoreData.length > 0) {
                scoreData.pop();
            }
            renderScore();
        }

        function clearScore() {
            scoreData = []; 
            selectedIndex = null;
            renderScore();
        }

        function handleScoreClick(e) {
            if (!e.target.closest('.item-container')) {
                selectedIndex = null;
                renderScore();
            }
        }

        function renderScore() {
            const scoreArea = document.getElementById('scoreArea');
            scoreArea.innerHTML = ''; 

            const timeSig = document.getElementById('timeSigSelect').value.split('/');
            const timeContainer = document.createElement('div');
            timeContainer.className = 'item-container';
            
            timeContainer.innerHTML = `
                <div class="top-text"></div>
                <div class="time-sig"><span>${timeSig[0]}</span><span>${timeSig[1]}</span></div>
                <div class="bottom-text"></div>
            `;
            scoreArea.appendChild(timeContainer);

            const undoBtn = document.getElementById('undoBtn');
            if (undoBtn) {
                if (selectedIndex !== null) {
                    undoBtn.innerText = '✂️ 刪除 Delete';
                    undoBtn.style.background = '#d35400';
                } else {
                    undoBtn.innerText = '↩️ 復原 Undo';
                    undoBtn.style.background = '#e67e22';
                }
            }

            if (scoreData.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.color = '#94a3b8';
                emptyMsg.style.fontSize = '18px';
                emptyMsg.style.margin = '20px auto';
                emptyMsg.style.width = '100%';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.innerHTML = '樂譜目前是空的，請點擊上方琴鍵輸入音符...<br><span style="font-size:14px;">The score is empty. Please click the keys above to add notes...</span>';
                scoreArea.appendChild(emptyMsg);
                return;
            }

            const displayMode = document.getElementById('displaySelect').value;

            scoreData.forEach((item, index) => {
                let mainElement;

                if (item.type === 'barline') {
                    const barContainer = document.createElement('div');
                    barContainer.className = 'item-container';
                    barContainer.innerHTML = `
                        <div class="top-text"></div>
                        <div class="bar-line"></div>
                        <div class="bottom-text"></div>
                    `;
                    mainElement = barContainer;
                } 
                else if (item.type === 'linebreak') {
                    const breakDiv = document.createElement('div');
                    breakDiv.className = isTeacherMode ? 'line-break edit-mode' : 'line-break';
                    mainElement = breakDiv;
                }
                else if (item.type === 'note' || item.type === 'rest') {
                    const container = document.createElement('div');
                    container.className = 'item-container';
                    if (item.beats === 0.5) container.classList.add('half-beat');

                    const fingeringDiv = document.createElement('div');
                    fingeringDiv.className = 'top-text';
                    fingeringDiv.innerText = item.fingering || '';
                    container.appendChild(fingeringDiv);

                    const noteDiv = document.createElement('div');
                    let beatClass = 'beat-1';
                    if (item.beats === 0.5) beatClass = 'beat-05';
                    if (item.beats === 2) beatClass = 'beat-2';
                    if (item.beats === 4) beatClass = 'beat-4';
                    
                    if (item.isRest) {
                        noteDiv.className = `score-note rest-note ${item.color} ${beatClass}`;
                        noteDiv.innerText = '休';
                    } else {
                        noteDiv.className = `score-note ${item.color} ${beatClass}`;
                        
                        let innerTextHTML = '';
                        if (displayMode === 'both') {
                            innerTextHTML = `<span class="note-solfege">${item.solfege}</span><span class="note-pitch">${item.pitch}</span>`;
                        } else if (displayMode === 'solfege') {
                            innerTextHTML = `<span class="note-solfege" style="font-size:22px;">${item.solfege}</span>`;
                        } else if (displayMode === 'pitch') {
                            innerTextHTML = `<span class="note-solfege" style="font-size:22px;">${item.pitch}</span>`;
                        }
                        noteDiv.innerHTML = `<div class="note-content">${innerTextHTML}</div>`;

                        if (item.octave === 1) noteDiv.innerHTML += '<span class="dot dot-high">•</span>';
                        if (item.octave === -1) noteDiv.innerHTML += '<span class="dot dot-low">•</span>';
                    }

                    noteDiv.id = `note-${item.id}`;
                    container.appendChild(noteDiv);

                    const lyricDiv = document.createElement('div');
                    lyricDiv.className = 'bottom-text';
                    lyricDiv.innerText = item.lyric || '';
                    container.appendChild(lyricDiv);

                    mainElement = container;
                }

                if (mainElement) {
                    if (selectedIndex === index) {
                        mainElement.classList.add('selected-item');
                    }

                    mainElement.onclick = function(e) {
                        e.stopPropagation(); 
                        if(isPlayingAll) return; 

                        if (item.type === 'note' || item.type === 'rest') {
                            playTone(item.baseFreq, item.octave, item.beats, item.isRest);
                            if (!isTeacherMode) {
                                const noteDiv = mainElement.querySelector('.score-note');
                                if (noteDiv) {
                                    noteDiv.style.transform = 'scale(1.2)';
                                    setTimeout(() => noteDiv.style.transform = 'scale(1)', 150);
                                }
                            }
                        }

                        if (isTeacherMode) {
                            selectedIndex = (selectedIndex === index) ? null : index;
                            renderScore();
                        }
                    };

                    scoreArea.appendChild(mainElement);
                }
            });
        }

        async function playAll() {
            if (isPlayingAll || scoreData.length === 0) return;
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            isPlayingAll = true;
            selectedIndex = null; 
            renderScore();

            const bpm = parseInt(document.getElementById('bpmSelect').value);
            const beatMs = (60 / bpm) * 1000; 

            for (let i = 0; i < scoreData.length; i++) {
                if (!isPlayingAll) break; 
                const item = scoreData[i];
                if (item.type === 'note' || item.type === 'rest') {
                    const noteElement = document.getElementById(`note-${item.id}`);
                    if(noteElement) noteElement.classList.add('playing-highlight');
                    
                    playTone(item.baseFreq, item.octave, item.beats, item.isRest);
                    await sleep(item.beats * beatMs);
                    
                    if(noteElement) noteElement.classList.remove('playing-highlight');
                } else if (item.type === 'barline') {
                    await sleep(100);
                }
            }
            isPlayingAll = false;
        }

        function exportPDF() { window.print(); }

        function toggleMode() {
            isTeacherMode = !isTeacherMode;
            const btn = document.getElementById('modeBtn');
            const teacherControls = document.getElementById('teacherControls');
            const studentControls = document.getElementById('studentControls');

            if (isTeacherMode) {
                btn.innerText = '🧑‍🏫 老師端 Teacher';
                btn.className = 'btn-primary btn-teacher';
                teacherControls.classList.remove('hidden');
                studentControls.classList.add('hidden');
            } else {
                btn.innerText = '👧 學生端 Student';
                btn.className = 'btn-primary btn-student';
                teacherControls.classList.add('hidden');
                studentControls.classList.remove('hidden');
                selectedIndex = null; 
            }
            renderScore();
        }
        
        renderScore();
    </script>
</body>
</html>
