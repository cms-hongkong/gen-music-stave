<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動彩虹樂譜課堂 v4</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; background-color: #f4f6f9; padding: 20px; margin: 0;
        }
        .header { margin-bottom: 20px; }
        
        /* 頂部按鈕區 */
        .top-bar {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .btn-primary { 
            padding: 10px 20px; font-size: 16px; border-radius: 20px; border: none; 
            cursor: pointer; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-teacher { background: #333; }
        .btn-student { background: #e74c3c; }
        .btn-export { background: #27ae60; }
        .btn-play { background: #8e44ad; }
        .btn-action { background: #95a5a6; color: white; padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; }

        /* 控制面板 */
        .control-panel {
            background: white; padding: 15px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 0 auto 20px auto;
            max-width: 900px; display: flex; justify-content: center; gap: 20px;
            flex-wrap: wrap; align-items: center;
        }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-weight: bold; color: #2c3e50; font-size: 14px; }
        select, input[type="text"] { 
            padding: 5px 10px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; 
        }
        input[type="text"] { width: 80px; text-align: center; }

        /* 樂譜區 */
        .score-area { 
            min-height: 250px; background: white; border: 3px dashed #cbd5e1; 
            border-radius: 20px; margin: 20px auto; width: 90%; max-width: 900px;
            padding: 30px 25px; display: flex; flex-wrap: wrap; gap: 15px; 
            align-items: flex-start; justify-content: flex-start;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* 拍子記號 */
        .time-sig {
            font-size: 32px; font-weight: bold; color: #2c3e50; 
            display: flex; flex-direction: column; line-height: 0.9;
            margin-right: 10px; justify-content: center;
        }

        /* 音符與指法容器 */
        .note-container {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        
        /* 指法/歌詞 */
        .fingering-text {
            font-size: 14px; font-weight: bold; color: #555; min-height: 20px;
        }

        /* 音符主體 */
        .score-note { 
            display: flex; align-items: center; justify-content: center; 
            color: #333; animation: popIn 0.3s ease; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; 
            transition: transform 0.1s, box-shadow 0.2s; position: relative;
        }
        
        /* 雙軌文字排版 (唱名 + 音名) */
        .note-content {
            display: flex; flex-direction: column; align-items: center; line-height: 1.1;
        }
        .note-solfege { font-size: 16px; font-weight: bold; }
        .note-pitch { font-size: 11px; opacity: 0.9; }

        /* 播放時發光特效 */
        .playing-highlight {
            transform: scale(1.15); box-shadow: 0 0 15px 5px rgba(241, 196, 15, 0.8); z-index: 10;
        }

        /* 拍子長短樣式 (加入四拍) */
        .beat-05 { width: 45px; height: 45px; border-radius: 50%; }
        .beat-1 { width: 60px; height: 60px; border-radius: 50%; }
        .beat-2 { width: 110px; height: 60px; border-radius: 30px; }
        .beat-4 { width: 200px; height: 60px; border-radius: 30px; } /* 四拍超長膠囊 */
        
        .bar-line {
            width: 3px; height: 60px; background-color: #34495e; 
            border-radius: 2px; margin: 0 5px; margin-top: 5px;
        }

        /* 高低音點 (強制黑色) */
        .dot { position: absolute; font-size: 26px; line-height: 1; color: black; font-weight: bold;}
        .dot-high { top: -16px; }
        .dot-low { bottom: -16px; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

        /* 琴鍵 */
        .keyboard { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .note-btn { 
            width: 70px; height: 70px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.5); 
            font-size: 16px; font-weight: bold; color: #333; cursor: pointer; 
            box-shadow: 0 6px 8px rgba(0,0,0,0.15); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; line-height: 1.1;
        }
        .note-btn:active { transform: scale(0.9); }
        
        /* 顏色設定 */
        .c-red { background-color: #FF4D4D; color: white; }
        .d-orange { background-color: #FF9E2C; color: white; }
        .e-yellow { background-color: #FFD700; color: black;}
        .f-green { background-color: #2ECC71; color: white; }
        .g-blue { background-color: #3498DB; color: white; }
        .a-indigo { background-color: #2980B9; color: white; }
        .b-purple { background-color: #9B59B6; color: white; }
        .hidden { display: none !important; }

        /* 列印 / PDF 匯出專用設定 */
        @media print {
            body { background: white; padding: 0; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .header, .top-bar, #teacherControls, #studentControls { display: none !important; }
            .score-area { 
                box-shadow: none; border: 2px solid #000; width: 100%; max-width: 100%;
                margin: 0; padding: 20px; page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="color: #2c3e50;">🎵 互動彩虹樂譜 (v4)</h2>
    </div>

    <div class="top-bar">
        <button id="modeBtn" class="btn-primary btn-teacher" onclick="toggleMode()">🧑‍🏫 老師端</button>
        <button class="btn-primary btn-play" onclick="playAll()">▶️ 播放全曲</button>
        <button class="btn-primary btn-export" onclick="exportPDF()">📄 匯出 PDF</button>
        
        <div class="control-group" style="background: white; padding: 5px 15px; border-radius: 20px;">
            <label>拍子記號：</label>
            <select id="timeSigSelect" onchange="renderScore()">
                <option value="4/4" selected>4/4</option>
                <option value="3/4">3/4</option>
                <option value="2/4">2/4</option>
            </select>
        </div>
    </div>

    <div id="teacherControls">
        <div class="control-panel">
            <div class="control-group">
                <label>高低音：</label>
                <select id="octaveSelect">
                    <option value="-1">低音 (下黑點)</option>
                    <option value="0" selected>中音</option>
                    <option value="1">高音 (上黑點)</option>
                </select>
            </div>
            <div class="control-group">
                <label>拍子：</label>
                <select id="beatSelect">
                    <option value="0.5">半拍</option>
                    <option value="1" selected>一拍</option>
                    <option value="2">兩拍</option>
                    <option value="4">四拍 (全音符)</option>
                </select>
            </div>
            <div class="control-group">
                <label>指法/文字：</label>
                <input type="text" id="fingeringInput" placeholder="例如: 1">
            </div>
            <div class="control-group">
                <button class="btn-action" onclick="addScoreItem({type: 'barline'})">➕ 小節線 (|)</button>
                <button class="btn-action" onclick="undo()" style="background:#e67e22;">↩️ 復原</button>
                <button class="btn-action" onclick="clearScore()" style="background:#e74c3c;">🗑️ 清空</button>
            </div>
        </div>
        
        <div class="keyboard" id="keyboardArea">
            <!-- 傳入 頻率, 唱名, 音名, 顏色類別 -->
            <button class="note-btn c-red" onclick="processInput(261.63, 'Do', 'C', 'c-red')"><span>Do</span><span style="font-size:11px;">C</span></button>
            <button class="note-btn d-orange" onclick="processInput(293.66, 'Re', 'D', 'd-orange')"><span>Re</span><span style="font-size:11px;">D</span></button>
            <button class="note-btn e-yellow" onclick="processInput(329.63, 'Mi', 'E', 'e-yellow')"><span>Mi</span><span style="font-size:11px;">E</span></button>
            <button class="note-btn f-green" onclick="processInput(349.23, 'Fa', 'F', 'f-green')"><span>Fa</span><span style="font-size:11px;">F</span></button>
            <button class="note-btn g-blue" onclick="processInput(392.00, 'Sol', 'G', 'g-blue')"><span>Sol</span><span style="font-size:11px;">G</span></button>
            <button class="note-btn a-indigo" onclick="processInput(440.00, 'La', 'A', 'a-indigo')"><span>La</span><span style="font-size:11px;">A</span></button>
            <button class="note-btn b-purple" onclick="processInput(493.88, 'Ti', 'B', 'b-purple')"><span>Ti</span><span style="font-size:11px;">B</span></button>
        </div>
    </div>

    <div id="studentControls" class="hidden" style="margin-bottom: 20px;">
        <p style="font-size: 20px; color: #e74c3c; font-weight: bold;">👀 請望住畫面上嘅音符篤落去發聲啦！</p>
    </div>

    <div class="score-area" id="scoreArea">
        <!-- 樂譜內容由 JS 動態生成 -->
    </div>

    <script>
        let isTeacherMode = true;
        let scoreData = []; 
        let isPlayingAll = false;
        
        // 音頻引擎初始化
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // 解決瀏覽器阻擋音頻問題：喺用家第一次點擊畫面時強制解鎖 AudioContext
        document.body.addEventListener('click', function() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true }); // once: true 代表只會執行一次

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function playTone(baseFreq, octaveIndex, beats) {
            // 確保每次發聲前 AudioContext 處於活躍狀態
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const finalFreq = baseFreq * Math.pow(2, octaveIndex);
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = finalFreq;
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            
            const duration = beats * 0.8; 
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // 處理琴鍵輸入
        function processInput(baseFreq, solfege, pitch, colorClass) {
            const octaveIndex = parseInt(document.getElementById('octaveSelect').value);
            const beats = parseFloat(document.getElementById('beatSelect').value);
            const fingering = document.getElementById('fingeringInput').value;
            
            playTone(baseFreq, octaveIndex, beats);
            
            if (isTeacherMode) {
                addScoreItem({
                    type: 'note',
                    baseFreq: baseFreq,
                    octave: octaveIndex,
                    beats: beats,
                    solfege: solfege, // 唱名
                    pitch: pitch,     // 音名
                    color: colorClass,
                    fingering: fingering,
                    id: Date.now() 
                });
                document.getElementById('fingeringInput').value = '';
            }
        }

        function addScoreItem(item) {
            scoreData.push(item);
            renderScore();
        }

        function undo() {
            if (scoreData.length > 0) {
                scoreData.pop();
                renderScore();
            }
        }

        function clearScore() {
            scoreData = [];
            renderScore();
        }

        // 渲染畫面
        function renderScore() {
            const scoreArea = document.getElementById('scoreArea');
            scoreArea.innerHTML = ''; 

            const timeSig = document.getElementById('timeSigSelect').value.split('/');
            const timeSigDiv = document.createElement('div');
            timeSigDiv.className = 'time-sig';
            timeSigDiv.innerHTML = `<span>${timeSig[0]}</span><span>${timeSig[1]}</span>`;
            scoreArea.appendChild(timeSigDiv);

            if (scoreData.length === 0) {
                const emptyMsg = document.createElement('span');
                emptyMsg.style.color = '#94a3b8';
                emptyMsg.style.fontSize = '18px';
                emptyMsg.innerText = '樂譜仲係空嘅，請點擊琴鍵輸入音符...';
                scoreArea.appendChild(emptyMsg);
                return;
            }

            scoreData.forEach((item) => {
                if (item.type === 'barline') {
                    const barDiv = document.createElement('div');
                    barDiv.className = 'bar-line';
                    scoreArea.appendChild(barDiv);
                } 
                else if (item.type === 'note') {
                    const container = document.createElement('div');
                    container.className = 'note-container';

                    const noteDiv = document.createElement('div');
                    
                    // 根據拍子決定樣式 (加入 4拍)
                    let beatClass = 'beat-1';
                    if (item.beats === 0.5) beatClass = 'beat-05';
                    if (item.beats === 2) beatClass = 'beat-2';
                    if (item.beats === 4) beatClass = 'beat-4';
                    
                    noteDiv.className = `score-note ${item.color} ${beatClass}`;
                    noteDiv.id = `note-${item.id}`;
                    
                    // 雙軌文字排版
                    noteDiv.innerHTML = `
                        <div class="note-content">
                            <span class="note-solfege">${item.solfege}</span>
                            <span class="note-pitch">${item.pitch}</span>
                        </div>
                    `;

                    // 高低音黑點
                    if (item.octave === 1) noteDiv.innerHTML += '<span class="dot dot-high">•</span>';
                    if (item.octave === -1) noteDiv.innerHTML += '<span class="dot dot-low">•</span>';

                    noteDiv.onclick = function() {
                        if(isPlayingAll) return; 
                        playTone(item.baseFreq, item.octave, item.beats);
                        noteDiv.style.transform = 'scale(1.2)';
                        setTimeout(() => noteDiv.style.transform = 'scale(1)', 150);
                    };

                    container.appendChild(noteDiv);

                    const fingeringDiv = document.createElement('div');
                    fingeringDiv.className = 'fingering-text';
                    fingeringDiv.innerText = item.fingering || ''; 
                    container.appendChild(fingeringDiv);

                    scoreArea.appendChild(container);
                }
            });
        }

        async function playAll() {
            if (isPlayingAll || scoreData.length === 0) return;
            // 確保播放前音效引擎已喚醒
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            isPlayingAll = true;

            for (let i = 0; i < scoreData.length; i++) {
                const item = scoreData[i];
                if (item.type === 'note') {
                    const noteElement = document.getElementById(`note-${item.id}`);
                    if(noteElement) noteElement.classList.add('playing-highlight');
                    
                    playTone(item.baseFreq, item.octave, item.beats);
                    await sleep(item.beats * 800);
                    
                    if(noteElement) noteElement.classList.remove('playing-highlight');
                } else if (item.type === 'barline') {
                    await sleep(100);
                }
            }
            isPlayingAll = false;
        }

        function exportPDF() { window.print(); }

        function toggleMode() {
            isTeacherMode = !isTeacherMode;
            const btn = document.getElementById('modeBtn');
            const teacherControls = document.getElementById('teacherControls');
            const studentControls = document.getElementById('studentControls');

            if (isTeacherMode) {
                btn.innerText = '🧑‍🏫 老師端';
                btn.className = 'btn-primary btn-teacher';
                teacherControls.classList.remove('hidden');
                studentControls.classList.add('hidden');
            } else {
                btn.innerText = '👧 學生端';
                btn.className = 'btn-primary btn-student';
                teacherControls.classList.add('hidden');
                studentControls.classList.remove('hidden');
            }
        }
        
        renderScore();
    </script>
</body>
</html>
